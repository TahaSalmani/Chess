artifacts_root : artifacts

data_ingestion :
  root_dir: artifacts/data_ingestion
  source_file: artifacts/lichess_db_standard_rated_2013-06.pgn
  local_data_file: artifacts/data_ingestion/raw_games.pgn
  source_URL : https://database.lichess.org/standard/lichess_db_standard_rated_2013-06.pgn.zst
  unzip_dir : artifacts/Data

data_validation :
  root_dir : artifacts/data_validation
  source_file : artifacts/Data/raw_games.pgn
  status_file : artifacts/data_validation/status.json

data_transformation :
  status_file: artifacts/data_validation/status.json
  root_dir : artifacts/data_transformation
  data_path : artifacts/Data/raw_games.pgn
  transformed_data_dir: artifacts/data_transformation/processed

prepare_base_Model :
  root_dir : artifacts/prepare_base_model
  model_path : artifacts/prepare_base_model/model.h5
  updated_base_model_path: artifacts/prepare_base_model/base_model_updated.h5

prepare_train_model:
  root_dir: artifacts/prepare_callbacks
  trained_model_path: artifacts/prepare_callbacks/trained_model.h5
  updated_base_model_path: artifacts/prepare_base_model/base_model_updated.h5
  transformed_x_path: artifacts/data_transformation/processed/X.npy
  transformed_y_path: artifacts/data_transformation/processed/Y.npy

evaluate_base_model :
  root_dir : artifacts/evaluate
  evaluate_scores : artifacts/evaluate/scores
  trained_model_path: artifacts/prepare_callbacks/trained_model.h5
  transformed_x_path: artifacts/data_transformation/processed/X.npy
  transformed_y_path: artifacts/data_transformation/processed/Y.npy

rl_environment :
  board_cols : 8
  board_row : 8
  pieces_type : 12
  action_space_size : 4096
  reward :
    checkmate: 100.0
    illegal_move: -10.0
    draw: 0.0
    step_penalty: 0.1

rl_train :
  root_dir : artifacts/rl_model/ppo_chess
  verbose : 1
  learning_rate : 0.001
  total_timesteps : 10000
  tensorboard_log_dir: "artifacts/tensorboard_logs"





