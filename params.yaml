IMAGE_SIZE: [8, 8, 17]
CLASSES: 4096
LEARNING_RATE: 0.0015
EPOCHS: 100
BATCH_SIZE: 256
VALIDATION_SPLIT : 0.2
SHUFFLE : TRUE

D_MODEL: 128
NUM_HEADS: 4
FF_DIM: 512
NUM_LAYERS: 10
IN_CHANNELS: 17
NUM_MOVES: 4096

NUM_SIMULATION : 200
MAX_MOVES : 50
NUM_GAMES : 10
C_PUCT : 1.5
POOL_SIZE : 32
# RL fine-tuning shares EPOCHS/BATCH_SIZE with stage 09 but needs its own, much lower lr.
RL_LEARNING_RATE : 0.0003
# AlphaZero-style loop: repeat self-play+train this many rounds so the value head bootstraps.
RL_ITERATIONS : 3
# Weight on the value MSE term (policy CE tends to dominate; >1 lets the value head learn).
VALUE_WEIGHT : 1.0
# Root exploration noise during self-play (Dirichlet), and how long to sample moves by
# visit-count temperature before switching to argmax.
DIRICHLET_ALPHA : 0.3
DIRICHLET_EPSILON : 0.25
TEMP_MOVES : 30
# Resignation: a self-play game ends once the search's own root value stays below
# -RESIGN_THRESHOLD for RESIGN_WINDOW consecutive moves after RESIGN_MIN_MOVES, so
# hopeless games yield +/-1 value targets instead of drifting to a move-cap draw.
RESIGN_THRESHOLD : 0.8
RESIGN_WINDOW : 3
RESIGN_MIN_MOVES : 30

